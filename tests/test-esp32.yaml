# CI compile test: an ESP32 Bluetooth proxy + the Truma Aventa package,
# using the components of this checkout instead of GitHub.
esphome:
  name: truma-test
  friendly_name: Truma test

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

api:
  encryption:
    key: "Pb5PVodKS1Dm3DT2X2gyXzNjVWfg3Rp/Ky5MFkrMTEs="

ota:
  - platform: esphome

wifi:
  ssid: "test"
  password: "testtesttest"

esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

packages:
  truma: !include
    file: ../packages/truma-aventa.yaml
    vars:
      aventa_mac: "C4:5B:BE:12:34:56"
      aventa_pin: "123456"
      truma_source: ../components
      log_frames: "true"

# Every platform, with non-default options, to exercise the code generation.
truma_inetx:
  - id: !extend truma
    device_name: "Aventa"
    poll_interval: 30s
    discovery_addresses: [0x0101, 0x0202]
    destinations:
      RoomClimate: 0x0202

sensor:
  - platform: truma_inetx
    truma_inetx_id: truma
    name: "Fan level raw"
    topic: AirCirculation
    parameter: FanLevel

select:
  - platform: truma_inetx
    truma_inetx_id: truma
    name: "Cooling mode"
    topic: AirCooling
    parameter: Mode
    options:
      0: "Confort"
      1: "Rapide"

switch:
  - platform: truma_inetx
    truma_inetx_id: truma
    name: "Cooling active"
    topic: AirCooling
    parameter: Active

binary_sensor:
  - platform: truma_inetx
    truma_inetx_id: truma
    name: "Cooling running"
    topic: AirCooling
    parameter: Active

text_sensor:
  - platform: truma_inetx
    truma_inetx_id: truma
    name: "Room climate mode raw"
    topic: RoomClimate
    parameter: Mode

# Explicit POSIX timezone: lets the test generate code without tz database lookups.
time:
  - id: !extend truma_time
    timezone: "CET-1CEST,M3.5.0,M10.5.0/3"

# Second climate entity: disabled optional parameters + fan mode mapping
climate:
  - platform: truma_inetx
    truma_inetx_id: truma
    name: "Aventa minimal"
    current_temperature_parameter: false
    preset_parameter: false
    action_parameter: false
    fan_mode_parameter:
      topic: AirCirculation
      parameter: FanLevel
      values:
        LOW: 2
        MEDIUM: 5
        HIGH: 10
        "Silence": 1
  # explicit per-mode setpoint / fan, single action source, custom fan labels
  - platform: truma_inetx
    truma_inetx_id: truma
    name: "Aventa per mode"
    custom_fan_modes: true
    target_temperature_parameter:
      topic: RoomClimate
      parameter: TgtTemp
      per_mode:
        COOL: {topic: AirCooling, parameter: TgtTemp}
    fan_mode_parameter:
      topic: AirCooling
      parameter: Mode
      values: {AUTO: 0, LOW: 1, MEDIUM: 2, HIGH: 3, "Nuit": 4}
      per_mode:
        HEAT: {topic: AirHeating, parameter: Mode}
        FAN_ONLY:
          topic: AirCirculation
          parameter: FanLevel
          values: {LOW: 1, MEDIUM: 2, HIGH: 3, "Turbo": 0}
    action_parameter:
      topic: AirCooling
      parameter: Active
      values: {COOLING: 1, IDLE: 2}
    preset_parameter:
      topic: AirCooling
      parameter: Mode
      values: {COMFORT: 0, BOOST: 3}

button:
  - platform: truma_inetx
    truma_inetx_id: truma
    type: refresh
    name: "Refresh override"
    icon: mdi:cached